<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f9f8f4"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="末廣家の家計簿"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon.svg"><title>末廣家の家計簿</title><link rel="stylesheet" href="style.css"></head>
<body><main class="app"><header><div><p class="eyebrow">OUR FAMILY JOURNAL</p><h1>末廣家の家計簿</h1></div><button class="icon-btn" id="exportBtn" title="データをバックアップ">⇩</button></header>
<section class="hero" aria-label="トップ写真"><img id="heroImage" alt="選んだトップ写真" hidden><div class="hero-placeholder" id="heroPlaceholder"><span>♡</span><p>末廣家の日々を、一枚に。</p></div><label class="photo-btn" for="heroUpload">📷 写真を変更</label><input type="file" accept="image/*" id="heroUpload" hidden></section>
<section class="summary"><div class="section-header"><span id="summaryMonth">2026年11月の家計</span><span class="small">毎日の積み重ね</span></div><div class="summary-cols"><div><label>収入</label><strong class="income" id="incomeSum">¥0</strong></div><div><label>支出</label><strong class="expense" id="expenseSum">¥0</strong></div></div><div class="balance"><span>今月の収支</span><strong id="balanceSum">¥0</strong></div></section>
<section class="calendar-section"><div class="month-nav"><button id="prevMonth" aria-label="前の月">‹</button><h2 id="monthTitle"></h2><button id="nextMonth" aria-label="次の月">›</button></div><div class="calendar" id="calendar"></div><p class="calendar-hint">日付をタップすると記録できます</p></section>
<section class="records"><div class="records-title"><h2 id="recordsTitle">今日の記録</h2><button class="add-btn" id="addEntry">＋ 記録する</button></div><div id="recordList"></div></section>
<footer>暮らしを、気負わず記録しよう。</footer></main>
<dialog id="entryDialog"><form id="entryForm" class="entry-form"><div class="dialog-top"><h2 id="dialogTitle">記録を追加</h2><button type="button" class="close-btn" id="closeDialog" aria-label="閉じる">×</button></div><label>日付<input id="entryDate" type="date" required></label><div class="type-switch"><label><input type="radio" name="type" value="expense" checked><span>支出</span></label><label><input type="radio" name="type" value="income"><span>収入</span></label></div><label>金額（円）<input id="entryAmount" type="number" min="1" step="1" inputmode="numeric" placeholder="例：1500" required></label><label>カテゴリー<select id="entryCategory"></select></label><label>メモ（任意）<input id="entryMemo" maxlength="100" placeholder="何に使った？"></label><label>写真（任意）<input id="entryPhoto" type="file" accept="image/*"></label><div class="entry-photo-preview" id="photoPreview"></div><button class="primary-btn" type="submit">保存する</button></form></dialog>
<script src="script.js"></script></body></html>
